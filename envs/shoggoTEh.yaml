name: shoggoTEh
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10
  - pandas
  - numpy
  - pyarrow
  - pyfaidx
  - pybedtools
  - bedtools
  - scikit-learn
  - matplotlib
  - certifi
  - pip
  - pip:
      # Pinned to the known-good version manually installed on Salvia
      # (production server) -- previously unpinned (torch>=2.0), which
      # caused resolver drift in production. Bump deliberately, not via
      # a floor constraint.
      - torch==2.5.1
      - transformers>=4.36
      - accelerate
      - einops
      - codecarbon
